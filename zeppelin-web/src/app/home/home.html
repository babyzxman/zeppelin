<div ng-controller="HomeCtrl as home" data-ng-init="initHome()">
  <div class="error-page">
    <img src="assets/images/404.svg"/>
    <h1>Page Not Found</h1>
    <span>We’re sorry, the page you requested could not be found</span>
    <br/>
    <span>Please go back to the </span>
    <span style="font-weight: bold;">Blendata Enterprise</span>
    <span> to start over</span>
    <br/>
    <button type="button"
            class="btn btn-default btn-xs redirectBtn"
            ><a class="link-redirect" href={{redirectURL}}>Go to Blendata</a>
    </button>
  </div>
  <img src="assets/images/bubble.svg" style="bottom:-90px;right:-90px;position:fixed;"/>
</div>
